<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Generate A Random Password</h1>

        <div class="display">
            <input type="text" id="password" name="password" placeholder="Your Password" readonly>
            <input type="button" id="copy" value="Copy" onclick="copyPassword()">
        </div>

        <div class="generate">
            <input type="button" id="generate" value="Generate" onclick="generatePassword()">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
